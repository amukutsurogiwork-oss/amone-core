name: AMONE intake
description: Route one owner comment ([MONE-REQUEST] / [AMU-RESULT]) and post at most one record comment.
inputs:
  token:
    description: Token for the calling repository's Issue/PR comments and labels.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    # github.action_path is the code at the commit the caller pinned.
    - name: Route the request
      shell: bash
      run: node "$ACTION_PATH/../../../scripts/intake.js"
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.token }}
